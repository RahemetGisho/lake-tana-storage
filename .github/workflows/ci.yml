name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (without Jupyter, to keep CI fast)
        run: |
          python -m pip install --upgrade pip
          grep -v '^jupyter' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Unit tests
        run: pytest -q

      - name: Smoke test the full pipeline on synthetic data
        run: python run.py --synthetic
